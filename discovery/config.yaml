# Chris Rohn's New Music — configuration.
# Everything here is free to use. Secrets (API keys, auth) live in GitHub Actions secrets, never here.

station:
  name: Indie Discotheque          # the YouTube Music library the picks are filed into (playlist naming)
  site_name: "Chris Rohn's New Music"   # what the public feed calls itself
  domain: chrisrohn.com
  repo: chrisrohn/chrisrohn        # the GitHub repository (the site pushes data/ratings.json here when ⚙ has a token)
  lastfm_user: tt_discotheque
  timezone: America/New_York

