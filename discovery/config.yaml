  curators:
    - chrisrohn@gmail.com
  # Guest rating (off by default): other Google accounts may sign in and rate; their 👍 go into THEIR OWN YouTube
  # library under the name below, never into the Indie Discotheque playlists. Every signed-in user shares the
  # project's daily YouTube API quota (10,000 units ≈ 200 saves in total), so leave this off unless you want it.
  guests: false
  guest_playlist_title_pattern: "{year} Picks from chrisrohn.com"

# ---------- The daily job's clock ----------
# GitHub Actions kills the Discover job at `timeout-minutes` (45), which loses the whole day: no feed, no commit.
# `daily` therefore gives itself less than that and hands what is left after the profile build to the feed, which
# splits it between fetching the sources and resolving them on YouTube Music. Every slow loop keeps a cursor or a
# cache, so a run cut short is not work lost — it is the next run's starting point.
job:
  budget_minutes: 36        # profile + feed; the rest of the 45 is the site build and the data commit

# ---------- Taste profile ----------
profile:
  # Last.fm periods to blend for artist affinity (weight per period).
  lastfm_periods:
    overall: 1.0
    12month: 1.6
    3month: 2.2
  lastfm_top_artists_limit: 1000   # 200 per request; cheap. Rank-decayed weight, so the tail mostly adds "you play them" matches.
  # How many top artists get expanded into similar artists (Last.fm + ListenBrainz). The associated artists are
  # what the artist-watch sources (YouTube Music, Deezer, MusicBrainz) check for releases, so wider = more supply.
  expand_top_n: 300
  # How many top artists contribute their Last.fm tags to the genre table (cached; wider = more tags match)
  tags_top_n: 400
  tag_floor: 0.01               # tags below this share of the strongest tag are dropped from the table
  similar_per_artist: 15
  similar_weight: 0.35          # affinity inherited by similar artists (× source artist affinity)
  # Last.fm genre artists: the acts Last.fm ranks highest under your strongest genre tags (tag.getTopArtists) join
  # the profile as kind "genre", a weaker cousin of "similar", so the artist-watch sources cover the scene the tags
  # describe and not only the acts you already play. Nationality / descriptor tags ("french", "female vocalists")
  # are skipped; a tag with a penalty never seeds anyone.
  genre_top_tags: 16            # the strongest tags of the table (after tag_boosts) that seed artists
  genre_artists_per_tag: 60     # Last.fm's top N artists for each of them (100 a request)
  genre_weight: 0.25            # affinity of a genre artist = this × the tag's weight × rank decay
  # Genre/tag weights are learned from Last.fm top tags of your top artists, then boosted by these:
  tag_boosts:
    indie pop: 1.5
    indietronica: 1.6
    indie dance: 1.8
    nu disco: 1.8
    nu-disco: 1.8
    disco: 1.3
    alternative dance: 1.7
    dance-punk: 1.6
    dance punk: 1.6
    synthpop: 1.5
    synth pop: 1.5
    electropop: 1.5
    chillwave: 1.4
    dream pop: 1.2
    art pop: 1.2
    neo-psychedelia: 1.2
    indie soul: 1.4
    french indie pop: 1.3
    new rave: 1.5
    electronic: 0.8
    indie rock: 0.9
    indie: 0.8
    post-punk: 1.0
    funk: 1.1
    house: 0.7
    shoegaze: 0.8
  # Tags that should push an item DOWN even if an artist matches.
  tag_penalties:
    metal: -3
    death metal: -4
    black metal: -4
    hardcore: -2
    country: -2
    christian: -3
    classical: -2
    trap: -1.5
    drill: -2
    k-pop: -1
    podcast: -5
  # Manual seed artists (always in the profile, weight 1.0). Add anything Last.fm is missing.
  seed_artists: []
  # Everynoise genre pages still work as frozen artist lists. Set to true to scrape them once as extra seeds
  # (`python -m discovery seed-everynoise`). Slugs are the part after "engenremap-".
  everynoise_genres:
    - indiepop
    - indietronica
    - nudisco
    - alternativedance
    - dancepunk
    - chillwave
    - neosynthpop
    - electropop
    - indiesoul
    - frenchindiepop
    - newrave
    - indiedisco

# ---------- Sources ----------
sources:
  # The whole fetching phase, however many sources are enabled. Also capped at half of what the job has left, so
  # resolution always gets its share. The artist watches below check it inside their own loops.
  time_budget_minutes: 14

  listenbrainz_fresh:
    enabled: true
    days: 90                 # look back (max 90)
    min_listen_count: 0
  musicbrainz_tags:
    enabled: true
    days: 10
    tags: [indie pop, indietronica, nu-disco, synthpop, electropop, indie dance, alternative dance, dance-punk, chillwave, dream pop, art pop, indie soul, new rave]
    limit_per_tag: 50
  bandcamp:
    enabled: true
    tags: [indie-pop, indietronica, nu-disco, synth-pop, electropop, indie-dance, alternative-dance, dance-punk, chillwave, dream-pop, art-pop, disco, indie-electronic, italo-disco]
    per_tag: 30
    slices: [new, top]       # Discover slices per tag: "new" arrivals (source "bandcamp"), "top" sellers (editorial, "bandcamp:top")
  deezer:
    enabled: true
    days: 45                 # look back for the editorial feeds (default 45; else listenbrainz_fresh.days); your artists' albums use the backfill window
    top_artists: 400         # check the newest albums of your top N profile artists (of the kinds below, by affinity)
    kinds: [direct, similar, genre]   # which profile artists count: the acts you play, their associates, the genre acts
    related_per_artist: 0    # set >0 to also pull related artists' newest releases (slower)
    editorial_genres:        # Deezer editorial "new releases" feeds by genre id
      - 85    # Alternative
      - 106   # Electro
      - 132   # Pop
      - 113   # Dance
  # Singles/albums from your profile artists, straight from YouTube Music (browse ids included; replaces Release Radar).
  # Every release from this year and the backfill window is returned on every run; the feed decides what is fresh.
  ytmusic_artists:
    enabled: true
    top_artists: 250          # checked per run, rotating through the pool so everyone gets covered every few days
    pool: 1500                # the strongest N profile artists of the kinds below, by affinity
    kinds: [direct, similar, genre]
  # Curator / session channels on YouTube (no record labels: the feed follows artists and genres, not imprints).
  # Free RSS per channel; wrong handles show up in ⚙ feed health.
  youtube_channels:
    enabled: true
    days: 30                 # uploads older than this are ignored (default 30; else listenbrainz_fresh.days)
    channels:
      - { name: "Majestic Casual", channel: "@majesticcasual" }
      - { name: "Eton Messy", channel: "@EtonMessy" }

  # ListenBrainz "Weekly Exploration" / "Weekly Jams" — free collaborative filtering. Make a ListenBrainz account,
  # import your Last.fm history (Settings → Import), then put the username here.
  listenbrainz_playlists:
    enabled: true
    user: "chrisrohn"
    kinds: [exploration, jams]
  # What tastemaker radio is actually playing (profile-matched, or recently released for KEXP).
  radio:
    enabled: true
    days: 14                 # a KEXP play counts as "recent" when its release date is within this (default 14; else listenbrainz_fresh.days)
    kexp: true
    pages: 12                # KEXP plays are paged back (200 a page) from the newest to the last run's airdate cursor; at most this many pages
    somafm: [poptron, indiepop]   # channel ids from somafm.com URLs, e.g. somafm.com/poptron
  # NTS Radio: the tracklists of the newest episodes of the shows below (aliases from nts.live/shows/<alias>);
  # only plays by profile artists are kept, as sightings dated by the broadcast.
  nts:
    enabled: true
    days: 14                 # episodes older than this are skipped (default 14; else listenbrainz_fresh.days)
    episodes_per_show: 2
    # aliases that 404 are dropped rather than retried daily: balearic-breakfast, charlie-bones, the-do-you-show
    # (2026-09-08). Check the alias in the nts.live/shows/<alias> URL before adding one back.
    shows: [moxie, bullion]
  # Music subreddits: "Artist - Song [genre] (year)" link posts to YouTube / Bandcamp / SoundCloud / Spotify.
  reddit:
    enabled: true
    days: 7                  # posts older than this are skipped (default 7; else listenbrainz_fresh.days)
    min_score: 5
    subreddits: [indieheads, listentothis, futurefunkairlines, nudisco]
  # Apple Music storefront charts (RSS marketing tools JSON): kept when the artist is in the profile or a genre matches.
  apple_music:
    enabled: true
    days: 30                 # albums released before this are skipped (default 30; else listenbrainz_fresh.days)
    storefront: us
    limit: 100
    feeds: [most-played]     # most-recent-albums 404s for the us storefront (2026-09-08); most-played still serves
    genres: [Alternative, Dance, Electronic, Pop, Indie Pop]
  # Release groups of your profile artists by MusicBrainz artist id (1 req/s: `top_artists` a run, rotating through
  # `pool`). The first-release-date window is the backfill window (see `backfill`), else `days`.
  musicbrainz_artists:
    enabled: true
    days: 60                 # first-release-date window when backfill is off (default 60; else listenbrainz_fresh.days)
    top_artists: 120
    pool: 1500
    kinds: [direct, similar, genre]
    limit: 40                # release groups per artist query
