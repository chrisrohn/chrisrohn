# ---------- Taste profile ----------
profile:
  # Last.fm periods to blend for artist affinity (weight per period).
  lastfm_periods:
    overall: 1.0
    12month: 1.6
    3month: 2.2
  lastfm_top_artists_limit: 1000   # 200 per request; cheap. Rank-decayed weight, so the tail mostly adds "you play them" matches.
  # How many top artists get expanded into similar artists (Last.fm + ListenBrainz).
  expand_top_n: 120
  similar_per_artist: 12
  similar_weight: 0.35          # affinity inherited by similar artists (× source artist affinity)
  # Genre/tag weights are learned from Last.fm top tags of your top artists, then boosted by these:
  tag_boosts:
    indie pop: 1.5
    indietronica: 1.6
    indie dance: 1.8
    nu disco: 1.8
    nu-disco: 1.8
    disco: 1.3
    alternative dance: 1.7
    dance-punk: 1.6
    dance punk: 1.6
    synthpop: 1.5
    synth pop: 1.5
    electropop: 1.5
    chillwave: 1.4
    dream pop: 1.2
    art pop: 1.2
    neo-psychedelia: 1.2
    indie soul: 1.4
    french indie pop: 1.3
    new rave: 1.5
    electronic: 0.8
    indie rock: 0.9
    indie: 0.8
    post-punk: 1.0
    funk: 1.1
    house: 0.7
    shoegaze: 0.8
  # Tags that should push an item DOWN even if an artist matches.
  tag_penalties:
    metal: -3
    death metal: -4
    black metal: -4
    hardcore: -2
    country: -2
    christian: -3
    classical: -2
    trap: -1.5
    drill: -2
    k-pop: -1
    podcast: -5
  # Manual seed artists (always in the profile, weight 1.0). Add anything Last.fm is missing.
  seed_artists: []
  # Everynoise genre pages still work as frozen artist lists. Set to true to scrape them once as extra seeds
  # (`python -m discovery seed-everynoise`). Slugs are the part after "engenremap-".
  everynoise_genres:
    - indiepop
    - indietronica
    - nudisco
    - alternativedance
    - dancepunk
    - chillwave
    - neosynthpop
    - electropop
    - indiesoul
    - frenchindiepop
    - newrave
    - indiedisco

# ---------- Sources ----------
sources:
  listenbrainz_fresh:
    enabled: true
    days: 90                 # look back (max 90)
    min_listen_count: 0
  musicbrainz_tags:
    enabled: true
    days: 10
    tags: [indie pop, indietronica, nu-disco, synthpop, electropop, indie dance, alternative dance, dance-punk, chillwave, dream pop, art pop, indie soul, new rave]
    limit_per_tag: 50
  bandcamp:
    enabled: true
    tags: [indie-pop, indietronica, nu-disco, synth-pop, electropop, indie-dance, alternative-dance, dance-punk, chillwave, dream-pop, art-pop, disco, indie-electronic, italo-disco]
    per_tag: 60
  deezer:
    enabled: true
    top_artists: 500         # check newest albums of your top N artists
    related_per_artist: 0    # set >0 to also pull related artists' newest releases (slower)
    editorial_genres:        # Deezer editorial "new releases" feeds by genre id
      - 85    # Alternative
      - 106   # Electro
      - 132   # Pop
      - 113   # Dance
