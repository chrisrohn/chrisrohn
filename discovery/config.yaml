  spotify:
    # Optional. Requires a Premium account + a dev-mode app since Feb 2026. Off by default.
    enabled: false
    top_artists: 100

# ---------- Ranking ----------
ranking:
  max_items: 500
  min_score: 0.6
  weights:
    affinity: 4.0          # direct artist match
    similar: 2.5           # similar-artist match
    tags: 1.2              # summed matched tag weights
    source_count: 0.6      # each additional source that surfaced the same track
    freshness: 1.0         # decays over `freshness_days`
    editorial: 1.5         # appeared in a curated feed (RSS/Bandcamp Daily/KEXP)
    listens: 0.4           # log10(listen_count) from ListenBrainz
  freshness_days: 14
  # Hide anything already in your year playlists, saved or skipped from the site.
  hide_seen: true

resolve:
  youtube_music: true
  max_lookups_per_run: 400
  # Year verification: MusicBrainz earliest release of each artist + title (1 req/s, cached); when MusicBrainz
  # doesn't know the recording, fall back to Deezer, then the iTunes Search API (~20 req/min). All free, all cached.
  max_year_lookups_per_run: 300
  max_fallback_year_lookups_per_run: 150
