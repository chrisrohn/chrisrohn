# Indie Discotheque discovery feed — configuration.
# Everything here is free to use. Secrets (API keys, auth) live in GitHub Actions secrets, never here.

station:
  name: Indie Discotheque          # the radio station / playlist naming
  site_name: "Chris Rohn's New Music"   # what the public feed calls itself
  domain: chrisrohn.com
  lastfm_user: tt_discotheque
  timezone: America/New_York

# Your YouTube Music year playlists ("2026 Indie Discotheque", "2025 Indie Discotheque", ... back to 1979).
# The site signs you in with Google and writes to these playlists from your browser. The daily build reads them
# (they're public) to seed your taste profile and to hide anything already saved or skipped.
youtube_music:
  playlist_title_pattern: "{year} Indie Discotheque"
  first_year: 1979
  # Any one of your year playlists; the build uses it to find your channel and then every other year playlist.
  playlists:
    "2026": PLTW5JZnPjE_q3bQltmawTeCJNF2VfH_dN
    "2025": PLTW5JZnPjE_onNAnNNGWFyek1iTfsdSrS
    "2024": PLTW5JZnPjE_pezZ1Xi92GmMvNM_mMLlvJ
  # 👎 are free: by default they're remembered in the browser only (no YouTube quota). Set skips_in_youtube: true
  # (or flip the switch in ⚙ on the site) to also file them into an unlisted "Skipped" playlist so every device and
  # the daily build see them. Each YouTube write costs 50 of the 10,000 daily quota units.
  skips_in_youtube: false
  skipped_playlist_title: "Indie Discotheque – Skipped"
  skipped_playlist_id: ""
  picks_count: 40                 # newest saves shown on the public "Picks" tab

# Sign in with Google on the site. Create a "Web application" OAuth client (see SETUP.md) and put its ID here —
# a client ID is public by design. Only the listed Google accounts get curator mode.
google:
  client_id: "903191577478-dev4etltn01rvubgi4fkqaulshltit7d.apps.googleusercontent.com"
  curators:
    - chrisrohn@gmail.com
  # Guest rating (off by default): other Google accounts may sign in and rate; their 👍 go into THEIR OWN YouTube
  # library under the name below, never into the Indie Discotheque playlists. Every signed-in user shares the
  # project's daily YouTube API quota (10,000 units ≈ 200 saves in total), so leave this off unless you want it.
  guests: false
  guest_playlist_title_pattern: "{year} Picks from chrisrohn.com"

# ---------- Taste profile ----------
profile:
  # Last.fm periods to blend for artist affinity (weight per period).
  lastfm_periods:
    overall: 1.0
    12month: 1.6
    3month: 2.2
  lastfm_top_artists_limit: 1000   # 200 per request; cheap. Rank-decayed weight, so the tail mostly adds "you play them" matches.
  # How many top artists get expanded into similar artists (Last.fm + ListenBrainz).
  expand_top_n: 120
  similar_per_artist: 12
  similar_weight: 0.35          # affinity inherited by similar artists (× source artist affinity)
  # Genre/tag weights are learned from Last.fm top tags of your top artists, then boosted by these:
  tag_boosts:
    indie pop: 1.5
    indietronica: 1.6
    indie dance: 1.8
    nu disco: 1.8
    nu-disco: 1.8
    disco: 1.3
    alternative dance: 1.7
    dance-punk: 1.6
    dance punk: 1.6
    synthpop: 1.5
    synth pop: 1.5
    electropop: 1.5
    chillwave: 1.4
    dream pop: 1.2
    art pop: 1.2
    neo-psychedelia: 1.2
    indie soul: 1.4
    french indie pop: 1.3
    new rave: 1.5
    electronic: 0.8
    indie rock: 0.9
    indie: 0.8
    post-punk: 1.0
    funk: 1.1
    house: 0.7
    shoegaze: 0.8
  # Tags that should push an item DOWN even if an artist matches.
  tag_penalties:
    metal: -3
    death metal: -4
    black metal: -4
    hardcore: -2
    country: -2
    christian: -3
    classical: -2
    trap: -1.5
    drill: -2
    k-pop: -1
    podcast: -5
  # Manual seed artists (always in the profile, weight 1.0). Add anything Last.fm is missing.
  seed_artists: []
  # Everynoise genre pages still work as frozen artist lists. Set to true to scrape them once as extra seeds
  # (`python -m discovery seed-everynoise`). Slugs are the part after "engenremap-".
  everynoise_genres:
    - indiepop
    - indietronica
    - nudisco
    - alternativedance
    - dancepunk
    - chillwave
    - neosynthpop
    - electropop
    - indiesoul
    - frenchindiepop
    - newrave
    - indiedisco

# ---------- Sources ----------
sources:
  listenbrainz_fresh:
    enabled: true
    days: 10                 # look back (max 90)
    min_listen_count: 0
  musicbrainz_tags:
    enabled: true
    days: 10
    tags: [indie pop, indietronica, nu-disco, synthpop, electropop, indie dance, alternative dance, dance-punk, chillwave, dream pop, art pop, indie soul, new rave]
    limit_per_tag: 50
  bandcamp:
    enabled: true
    tags: [indie-pop, indietronica, nu-disco, synth-pop, electropop, indie-dance, alternative-dance, dance-punk, chillwave, dream-pop, art-pop, disco, indie-electronic, italo-disco]
    per_tag: 60
  deezer:
    enabled: true
    top_artists: 150         # check newest albums of your top N artists
    related_per_artist: 0    # set >0 to also pull related artists' newest releases (slower)
    editorial_genres:        # Deezer editorial "new releases" feeds by genre id
      - 85    # Alternative
      - 106   # Electro
      - 132   # Pop
      - 113   # Dance
  # New singles/albums from your top artists, straight from YouTube Music (video IDs included; replaces Release Radar).
  ytmusic_artists:
    enabled: true
    top_artists: 150          # checked per run, rotating through the pool so everyone gets covered every few days
    pool: 600
  # Label / curator / session channels on YouTube. Free RSS per channel; wrong handles show up in ⚙ feed health.
  youtube_channels:
    enabled: true
    channels:
      - { name: "Toy Tonics", channel: "@toytonics" }
      - { name: "Razor-N-Tape", channel: "@RazorNTape" }
      - { name: "Italians Do It Better", channel: "@ItaliansDoItBetter" }
      - { name: "Kitsuné Musique", channel: "@KitsuneMusique" }
      - { name: "Ed Banger Records", channel: "@edbangerrecords" }
      - { name: "Roche Musique", channel: "@RocheMusique" }
      - { name: "Future Classic", channel: "@futureclassic" }
      - { name: "Ghostly International", channel: "@ghostly" }
      - { name: "Ninja Tune", channel: "@ninjatune" }
      - { name: "Cascine", channel: "@cascine" }
      - { name: "Majestic Casual", channel: "@majesticcasual" }
      - { name: "Eton Messy", channel: "@EtonMessy" }
      - { name: "KEXP live sessions", channel: "@kexp" }
      - { name: "COLORS", channel: "@COLORSxSTUDIOS" }
  # ListenBrainz "Weekly Exploration" / "Weekly Jams" — free collaborative filtering. Make a ListenBrainz account,
  # import your Last.fm history (Settings → Import), then put the username here.
  listenbrainz_playlists:
    enabled: true
    user: "chrisrohn"
    kinds: [exploration, jams]
  # What tastemaker radio is actually playing (profile-matched, or recently released for KEXP).
  radio:
    enabled: true
    kexp: true
    somafm: [poptron, indiepop]   # channel ids from somafm.com URLs, e.g. somafm.com/poptron
  # Labels you trust: every release they put out in the window, via MusicBrainz.
  musicbrainz_labels:
    enabled: true
    labels:
      - Toy Tonics
      - Razor-N-Tape
      - Italians Do It Better
      - Kitsuné
      - Ed Banger Records
      - Roche Musique
      - Future Classic
      - Ghostly International
      - Cascine
      - Heavenly Recordings
      - Lucky Number
      - Captured Tracks
      - Mexican Summer
      - Bella Union
      - Permanent Vacation
      - Music For Dreams
      - Nang
      - Midnight Riot
      - Glitterbox Recordings
      - Athens of the North
      - Soundway
      - Mr Bongo
      - Big Crown Records
      - Colemine Records
  rss:
    enabled: true
    # Headlines shaped like `Artist – "Song"` become playable cards; other posts are kept only if they mention a
    # profile artist. Dead or noisy feeds show up in ⚙ → feed health on the site; prune freely.
    feeds:
      # --- disco / nu-disco / indie dance / balearic (closest to the station) ---
      - { name: "Le Visiteur", url: "https://levisiteuronline.com/feed/" }
      - { name: "Ransom Note", url: "https://www.theransomnote.com/feed/" }
