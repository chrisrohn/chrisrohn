# ---------- Ranking ----------
ranking:
  max_items: 450           # the day's list; the site shows a shortlist of it (⚙ sets how many) and "show all" the rest
                           # …with room for a full backfill on top of a rich fresh window: this cut is by score, so too
                           # low a cap silently drops the fill it was told to make (the older cards score lowest)
  min_score: 0.6
  # One act must not own the day: past this many tracks by the same artist each further one loses `repeat_penalty`
  # from its score, so it drops down the list. Nor may one tag crawler: past `max_unknown_per_source` tracks by
  # artists the profile does not know from the same source family (bandcamp, rss, musicbrainz…) the same penalty
  # applies, so the day stays anchored on your artists and their associates. And the top `learn.shown_rank` always
  # holds `explore_slots` tracks by artists the profile does not know, so newcomers get seen at all.
  max_per_artist: 3
  max_unknown_per_source: 30
  repeat_penalty: 2.0
  explore_slots: 8
  # A card with no YouTube match cannot be played or filed: it loses this much after resolution, so playable cards
  # come first and an unplayable one only survives the score floor when the match is strong.
  unplayable_penalty: 1.0
  weights:
    affinity: 4.0          # direct artist match (Last.fm / seeds: you play them)
    saved: 2.0             # artist only known from the year playlists (in your library, never scrobbled)
    similar: 2.5           # similar-artist match
    genre: 2.0             # a Last.fm genre artist (top of a tag you play; see profile.genre_top_tags)
    tags: 1.2              # summed matched tag weights
    source_count: 0.6      # each additional source that surfaced the same track
    freshness: 1.0         # decays over `freshness_days`
    editorial: 1.5         # appeared in a curated feed (RSS/Bandcamp Daily/KEXP)
    listens: 0.4           # log10(listen_count) from ListenBrainz
    playable: 0.3          # a YouTube match exists (it can be played and filed)
    learned: 1.0           # the keep-rate adjustments learned from your history (see `learn` below)
    explore: 1.0           # the exploration bonus for sources / tags / artists with little history (learn.explore)
    novelty: 0.5           # an artist the profile does not know, vouched for by an editorial feed or two sources
  freshness_days: 60       # a release this many days old has spent its freshness bonus (the sources look back ~90 days)
  undated_freshness: 0.2   # share of the freshness weight for an item nobody dates; below anything released this month
  # What counts as the current timeframe: a release (or sighting) dated within this many days, plus everything from
  # this calendar year whatever month it landed in, plus anything nobody dates. Earlier years are backfill (below).
  fresh_days: 90
  # Hide anything already in your year playlists, saved or skipped from the site.
  hide_seen: true

# ---------- Backfill: when the current timeframe runs thin, look further back ----------
# The artist-watch sources (YouTube Music, Deezer, MusicBrainz) return releases back to `years` years ago for your
# artists, their associates and the genre artists. The feed is built from the fresh window first; only when it holds
# fewer than `target` playable, unrated cards do the best older releases fill the gap, up to `max` a day, marked
# "filling in from <year>" on the card and filed into their own year. Nothing older than the window is ever pulled.
# The fill costs nothing extra: those older candidates are fetched, scored and resolved on YouTube every run
# whatever `target` says — a lower target only threw the resolved ones away (373 of them on 2026-09-08, for a day
# that was emptied by the evening). `target` is therefore set to what a day is actually rated down to, not to what
# the fresh window happens to yield.
backfill:
  years: 3                 # 0 turns backfill off (the sources fall back to their own `days`)
  target: 300              # playable current cards the day should hold before anything older is used
  max: 200                 # the most older cards one day may carry: even a thin day stays a third current music
  candidates: 600          # the best older candidates carried into resolution (the rest wait for another day)

# ---------- Learning from outcomes (discovery/learn.py) ----------
# No API quota involved: what each day's feed showed (site/data/history/) is compared with what reached the year
# playlists (kept) or the Skipped playlist (skipped, only when skips are filed on YouTube). Sources, blogs, tags and
# artists get a keep rate against the overall rate, added to the score as a bounded log2 ratio.
# Skips reach the build two ways: the Skipped playlist (when skips_in_youtube is on) and data/ratings.json, which the
# site pushes from the browser when a GitHub token is set in ⚙ (every keep and skip, no YouTube quota).
learn:
  grace_days: 3          # a track shown more recently than this may simply not have been listened to yet
  pass_weight: 0.35      # shown for grace_days and never filed anywhere: a weak "no" (a filed skip counts as 1.0)
  shown_rank: 80         # a "pass" only counts for tracks that ranked this high (the shortlist is what gets seen)
  half_life_days: 21     # an outcome this old counts half; last season's taste does not outweigh this month's
  prior: 8               # pseudo-observations at the overall keep rate before a source / tag / artist moves the score
  min_exposures: 3       # fewer sightings than this: no opinion yet
  max_adjust: 1.5        # the log2 ratio is clamped to ±this, so one lucky blog can't dominate
  explore: 0.4           # UCB exploration: explore · sqrt(ln N / (n + 1)) per feature, so the unfamiliar gets a look
  explore_max: 0.6       # … capped here, so a complete unknown never outranks a proven favourite on novelty alone

# ---------- The catalog: infill for earlier years (discovery/catalog.py) ----------
# Runs after the feed in the daily job and publishes site/data/catalog.json for the Catalog tab. Candidates are your
# own Last.fm history (most-played and loved tracks not yet in a playlist) plus the top tracks of the artists you
# play and of their similar artists; the candidate snapshot is refreshed weekly, YouTube resolution and year
# verification proceed in daily batches on the feed's caches, so the catalog grows over a couple of weeks.
catalog:
  enabled: true
  refresh_days: 7
  top_tracks: 3000          # user.getTopTracks, overall (1000 per request)
  loved_tracks: 2000
  artists_top_n: 150        # your top artists by affinity …
  per_artist: 8             # … and this many of each one's top tracks
  similar_top_n: 100        # the strongest similar artists (adjacent to what you play) …
  per_similar: 5
  max_items: 2000           # candidates carried into resolution, by score
  in_daily: false           # true = also run at the end of the daily feed job; the Catalog workflow is its own job
  time_budget_minutes: 35   # wall clock for the lookups in the Catalog workflow (it times out at 45)
  job_budget_minutes: 40    # when run inside the daily job: never past this point of that job
  max_lookups_per_run: 800
  max_year_lookups_per_run: 800
  year_chain: fast          # fast = ListenBrainz/MusicBrainz + Deezer, then the YouTube Music album year; full = + Discogs + iTunes
  tag_lookups_per_run: 300  # artists whose Last.fm tags get fetched per run (cached for good afterwards)
  loved_bonus: 1.5
  weights:                  # overrides of ranking.weights for the catalog: plays count for a lot, freshness for nothing
    listens: 2.0
    freshness: 0.0
    editorial: 0.0

resolve:
  youtube_music: true
  max_lookups_per_run: 700
  audio_heals_per_run: 150      # older cached hits re-checked for an audio-only counterpart and their album year, per run
  counterparts_per_run: 300     # greyed-out playlist tracks searched for a streamable upload per run (Cleanup tab → data/unavailable.json)
  year_chain: full              # the feed asks every catalogue; the catalog's own setting is under `catalog`
  # Year verification (see discovery/years.py): identify the recording via ListenBrainz's MusicBrainz mapper, take
  # MusicBrainz's earliest release date for it, cross-check with Deezer (ISRC → MusicBrainz), Discogs master year
  # (needs a free DISCOGS_TOKEN secret) and the iTunes Search API. All free, all cached. Each track costs 2–6 requests
  # at MusicBrainz's 1 req/s, so the budget below bounds a run to roughly 15 minutes; the rest is picked up next run.
  max_year_lookups_per_run: 500
  max_duplicate_year_lookups_per_run: 120   # cross-year duplicates in your playlists get a verified year, a batch per run
  time_budget_minutes: 28       # wall clock shared by YouTube + year lookups; whatever is left over waits for tomorrow (job timeout is 45)
  cache_keep_days: 120          # drop YouTube / year cache entries that no feed item has touched for this long
  discogs: true                 # use Discogs when DISCOGS_TOKEN is set
  always_cross_check: false     # true = also ask Deezer/ISRC even when MusicBrainz already answered (slower, more evidence)

# ---------- Concerts: who is playing near Detroit (discovery/concerts.py) ----------
# The Songkick page, rebuilt from open sources: every artist played on Indie Discotheque in the last year (the
# Last.fm 12-month chart of tt_discotheque, plus anyone filed into this year's playlist), asked on Bandsintown for
# upcoming shows, kept when the venue is within `radius_miles` of `center`, with each act's most popular song
# (Last.fm, else Deezer) resolved on YouTube Music so the Concerts tab plays it in place. With a free
# TICKETMASTER_API_KEY secret, Ticketmaster's Discovery API adds every music event in the radius (tickets, prices,
# sale status) matched against the same artists. Its own daily workflow (Concerts); nothing here spends YouTube quota.
concerts:
  enabled: true
  center: { name: "Detroit, MI", lat: 42.3314, lon: -83.0458 }
  radius_miles: 80
  months_ahead: 12            # shows further out wait (Bandsintown lists festivals a year ahead)
  lastfm_limit: 0             # user.getTopArtists over 12 months, 200 a request; 0 = every artist Last.fm has
  playlist_years: 1           # artists filed into this year's playlist count as played (2 = last year's too)
  refresh_days: 2             # an artist's listings are asked for again after this
  artists_per_run: 1500       # Bandsintown lookups a run, the most played first; the rest wait for the next run
  time_budget_minutes: 12     # wall clock for the artist loop (the workflow times out at 30)
  top_tracks_per_run: 300     # most-popular-song lookups a run (only artists with a show nearby; cached for good)
  resolve_per_run: 300        # YouTube Music lookups for those songs a run (the feed's cache is shared)
  bandsintown:
    enabled: true
    app_id: chrisrohn.com     # Bandsintown's public API asks for an app id naming the caller (BANDSINTOWN_APP_ID overrides)
  ticketmaster:
    enabled: true             # only does anything when the TICKETMASTER_API_KEY secret is set (free at developer.ticketmaster.com)
    size: 200                 # events a request (Ticketmaster's most)
    requests_per_run: 60      # Ticketmaster stops paging at 1,000 results, so the months_ahead horizon is split into date windows
                              # that fit; this caps the requests spent on them a run (the soonest windows first; 5,000 a day is free)
  in_daily: false             # true = also run at the end of the daily feed job; the Concerts workflow is its own job
