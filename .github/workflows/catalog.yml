name: Catalog

# Builds the catalog (site/data/catalog.json: candidates for the earlier years, from Last.fm history) and publishes
# the site. Its own job, a few hours after Discover, so the lookups get a full 45 minutes instead of the feed's
# leftovers. Nothing here writes to your YouTube Music playlists: only a thumb pressed on the site does that.

on:
  schedule:
    - cron: "15 15 * * *"      # 11:15 New York in summer: five hours after Discover, never overlapping it
  workflow_dispatch:

concurrency:
  group: discovery-data
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write   # the data commit
      issues: write     # the build-failure issue
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: discovery/requirements.lock

      # exact, hash-checked versions: a surprise ytmusicapi/feedparser release can't land in the daily job unreviewed
      - run: pip install --require-hashes -r discovery/requirements.lock

      # the HTTP response cache is gitignored (it is big and churns); keep it between runs so MusicBrainz, Deezer and
      # ListenBrainz answers from the last ~20 h are reused instead of re-fetched at 1 request/s
      - uses: actions/cache@v6
        with:
          path: |
            data/cache/sources.json
            data/cache/profile.json
            data/cache/catalog.json
            data/cache/feed_etags.json
          key: http-cache-${{ github.run_id }}
          restore-keys: http-cache-

      - name: Build catalog
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
        run: python -m discovery catalog

      - name: Commit data
        run: |
          git config user.name "new-music-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data site/data site/feed.xml
          if git diff --cached --quiet; then echo "no data changes"; exit 0; fi
          git commit -m "catalog: $(date -u +%Y-%m-%d) [skip ci]"
          pushed=0
          for i in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then pushed=1; break; fi
            sleep $((i*5))
          done
          # four failed pushes must fail the job (and open the issue below), never pass quietly with the day's data lost
          [ "$pushed" = 1 ] || { echo "::error::could not push the data commit after 4 attempts"; exit 1; }

      - name: Pick up site changes merged while this build ran
        run: git pull --rebase origin main || true

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build the site (dist/)
        run: npm run build

      # a failed build means the site keeps serving yesterday's feed with nothing to say so: open (or update) one issue
      - name: Report a failed build
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const title = "Catalog build failed";
            const body = `The **Catalog** workflow failed on ${new Date().toISOString().slice(0, 10)}: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nchrisrohn.com keeps serving the previous catalog until a run succeeds.`;
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: "open", labels: "build-failure", per_page: 1 });
            if (open.length) await github.rest.issues.createComment({ ...context.repo, issue_number: open[0].number, body });
            else await github.rest.issues.create({ ...context.repo, title, body, labels: ["build-failure"] });

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true   # dist/.nojekyll comes from site/; v4+ skips dotfiles by default

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # one Pages deployment at a time across Discover, Catalog and Publish: two at once race for the same site
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
