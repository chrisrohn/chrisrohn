name: Decisions

# Fired ONLY when you press "Sync approvals" on the site (repository_dispatch, event_type = decisions).
# Records each thumb in data/decisions.json, adds 👍 tracks to "<year> Indie Discotheque" in your
# YouTube Music library, then rebuilds the feed so rated items move to the archive.

on:
  repository_dispatch:
    types: [decisions]
  workflow_dispatch:
    inputs:
      decisions_json:
        description: 'Manual payload, e.g. {"decisions":[{"id":"abc","decision":"up","year":2026,"videoId":"..."}]}'
        required: false

concurrency:
  group: discovery-data
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: discovery/requirements.txt

      - run: pip install -r discovery/requirements.txt

      - name: Apply decisions (file approvals into year playlists)
        env:
          YTMUSIC_OAUTH_JSON: ${{ secrets.YTMUSIC_OAUTH_JSON }}
          YTMUSIC_OAUTH_CLIENT_ID: ${{ secrets.YTMUSIC_OAUTH_CLIENT_ID }}
          YTMUSIC_OAUTH_CLIENT_SECRET: ${{ secrets.YTMUSIC_OAUTH_CLIENT_SECRET }}
          YTMUSIC_HEADERS_RAW: ${{ secrets.YTMUSIC_HEADERS_RAW }}
          YTMUSIC_BROWSER_JSON: ${{ secrets.YTMUSIC_BROWSER_JSON }}
          DECISIONS_JSON: ${{ toJSON(github.event.client_payload) }}
          MANUAL_JSON: ${{ inputs.decisions_json }}
        run: |
          if [ -n "$MANUAL_JSON" ]; then export DECISIONS_JSON="$MANUAL_JSON"; fi
          python -m discovery decisions

      - name: Rebuild feed without rated items
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: python -m discovery build

      - name: Commit data
        run: |
          git config user.name "indie-discotheque-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data site/data site/feed.xml
          if git diff --cached --quiet; then echo "no data changes"; exit 0; fi
          git commit -m "decisions: $(date -u +%Y-%m-%dT%H:%M) [skip ci]"
          for i in 1 2 3 4; do git pull --rebase origin main && git push origin HEAD:main && break || sleep $((i*5)); done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: apply
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
