name: Discover

# Builds the Chris Rohn's New Music feed and publishes the site.
# Nothing in this workflow writes to your YouTube Music playlists: only a thumb pressed on the site does that.

on:
  # GitHub runs scheduled workflows on a best-effort queue and routinely holds one back for hours at busy times —
  # the top of the hour and :15 are the worst of them, and a run can be dropped outright. A single 06:15 New York
  # slot therefore did not mean a feed by breakfast: it started 5h34 late on 2026-09-07 and 4h16 late on 2026-09-08.
  # So the morning gets three attempts at unpopular minutes. The `check` job below stops every slot after the one
  # that publishes the day's feed, so a normal morning is still exactly one build — and a slot that is delayed,
  # dropped or killed at the timeout is simply retried by the next one, in time to be read over coffee.
  schedule:
    - cron: "7 6 * * *"        # 02:07 New York in summer (EDT), 01:07 in winter (EST): GitHub cron is UTC only
    - cron: "29 8 * * *"       # 04:29 EDT — the retry, if the first slot was late, dropped or cut short
    - cron: "47 10 * * *"      # 06:47 EDT — the last one that can still land before the morning read
  workflow_dispatch:
    inputs:
      rebuild_profile:
        description: "Force a taste-profile rebuild"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["discovery/**", ".github/workflows/discover.yml"]   # site-only changes go out via publish.yml in ~1 min

concurrency:
  group: discovery-data
  cancel-in-progress: false

permissions: {}

jobs:
  # Which of the morning's three slots does the work: the first one to find no feed for today. Every build writes
  # site/data/history/<UTC date>.json in the same commit as the feed, so that file's existence on main is the exact
  # question "has today's feed been published?" — and it appears only after a build that finished and pushed, so a
  # run that was cut short leaves the next slot to try again rather than being papered over. A push (the pipeline
  # changed) or a manual run always builds.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      build: ${{ steps.gate.outputs.build }}
    steps:
      - id: gate
        uses: actions/github-script@v9
        with:
          script: |
            if (context.eventName !== "schedule") return core.setOutput("build", "true");
            const path = `site/data/history/${new Date().toISOString().slice(0, 10)}.json`;
            try {
              await github.rest.repos.getContent({ ...context.repo, path, ref: "main" });
            } catch (e) {
              // 404 is the answer we are looking for; anything else is the API having a bad minute, and a feed
              // built twice is a great deal better than a morning with none
              if (e.status !== 404) core.warning(`could not read ${path} (${e.status}); building anyway`);
              else core.info(`${path} is not published yet — building the day's feed.`);
              return core.setOutput("build", "true");
            }
            core.notice(`${path} is already published: today's feed is out, this slot has nothing to do.`);
            core.setOutput("build", "false");

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write   # the data commit
      issues: write     # the build-failure issue
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: discovery/requirements.lock

      # exact, hash-checked versions: a surprise ytmusicapi/feedparser release can't land in the daily job unreviewed
      - run: pip install --require-hashes -r discovery/requirements.lock

      # the HTTP response cache is gitignored (it is big and churns); keep it between runs so MusicBrainz, Deezer and
      # ListenBrainz answers from the last ~20 h are reused instead of re-fetched at 1 request/s
      - uses: actions/cache@v6
        with:
          path: |
            data/cache/sources.json
            data/cache/profile.json
            data/cache/catalog.json
            data/cache/concerts.json
            data/cache/feed_etags.json
          key: http-cache-${{ github.run_id }}
          restore-keys: http-cache-

      - name: Build feed
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          REBUILD_PROFILE: ${{ inputs.rebuild_profile }}   # through env, never interpolated into the script
        run: |
          if [ "$REBUILD_PROFILE" = "true" ]; then
            python -m discovery daily --rebuild-profile
          else
            python -m discovery daily
          fi

      - name: Commit data
        run: |
          git config user.name "new-music-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data site/data site/feed.xml
          if git diff --cached --quiet; then echo "no data changes"; exit 0; fi
          git commit -m "feed: $(date -u +%Y-%m-%d) [skip ci]"
          pushed=0
          for i in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then pushed=1; break; fi
            sleep $((i*5))
          done
          # four failed pushes must fail the job (and open the issue below), never pass quietly with the day's data lost
          [ "$pushed" = 1 ] || { echo "::error::could not push the data commit after 4 attempts"; exit 1; }

      - name: Pick up site changes merged while this build ran
        run: git pull --rebase origin main || true

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build the site (dist/)
        run: npm run build

      # A build that does not finish means the site keeps serving yesterday's feed: open (or update) one issue.
      # `cancelled()` is in there because a job killed at `timeout-minutes` ends as cancelled, not as a failure —
      # that is exactly how 2026-09-08's run was lost in silence, with no issue and no banner.
      - name: Report a build that did not finish
        if: failure() || cancelled()
        uses: actions/github-script@v9
        with:
          script: |
            const title = "Daily feed build failed";
            const how = "${{ job.status }}" === "cancelled" ? "was cut short (the 45-minute timeout, or a cancellation)" : "failed";
            const body = `The **Discover** workflow ${how} on ${new Date().toISOString().slice(0, 10)}: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nThe next scheduled slot this morning retries it on its own (it builds whenever no feed for the day has been published). chrisrohn.com keeps serving the previous feed meanwhile, and says on the page that the day's build has not landed.`;
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: "open", labels: "build-failure", per_page: 1 });
            if (open.length) await github.rest.issues.createComment({ ...context.repo, issue_number: open[0].number, body });
            else await github.rest.issues.create({ ...context.repo, title, body, labels: ["build-failure"] });

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true   # dist/.nojekyll comes from site/; v4+ skips dotfiles by default

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # one Pages deployment at a time across Discover, Catalog, Concerts and Publish: two at once race for the same site
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
