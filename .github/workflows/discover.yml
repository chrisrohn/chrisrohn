name: Discover

# Builds the Indie Discotheque new-music feed and publishes the site.
# Nothing in this workflow writes to your YouTube Music playlists — see decisions.yml for the approval flow.

on:
  schedule:
    - cron: "15 10 * * *"      # 06:15 America/New_York (EDT) daily
  workflow_dispatch:
    inputs:
      rebuild_profile:
        description: "Force a taste-profile rebuild"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["discovery/**", ".github/workflows/discover.yml"]   # site-only changes go out via publish.yml in ~1 min

concurrency:
  group: discovery-data
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: discovery/requirements.txt

      - run: pip install -r discovery/requirements.txt

      - name: Build feed
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          if [ "${{ inputs.rebuild_profile }}" = "true" ]; then
            python -m discovery daily --rebuild-profile
          else
            python -m discovery daily
          fi

      - name: Commit data
        run: |
          git config user.name "indie-discotheque-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data site/data site/feed.xml
          if git diff --cached --quiet; then echo "no data changes"; exit 0; fi
          git commit -m "feed: $(date -u +%Y-%m-%d) [skip ci]"
          for i in 1 2 3 4; do git pull --rebase origin main && git push origin HEAD:main && break || sleep $((i*5)); done

      - name: Pick up site changes merged while this build ran
        run: git pull --rebase origin main || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
