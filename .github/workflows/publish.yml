name: Publish site

# Fast path: a change to the site files alone is live in about a minute. The data build (Discover) is only needed
# when the pipeline or its config changes, or on the daily schedule — it republishes the site too, after pulling
# the latest main, so the two never fight.

on:
  push:
    branches: [main]
    paths: ["site/**", "!site/data/**", "!site/feed.xml", "build.mjs", "package.json", "package-lock.json", ".github/workflows/publish.yml"]
  workflow_dispatch:

concurrency:
  group: pages-publish
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      # the site must load and render the committed feed in a real browser before it goes live
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check          # lint, type check, then build dist/
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true   # dist/.nojekyll comes from site/; v4+ skips dotfiles by default
      - id: deployment
        uses: actions/deploy-pages@v5
