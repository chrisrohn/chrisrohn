name: Connect YouTube Music

# One-time (and whenever the token stops working). Runs Google's device sign-in flow inside Actions:
# open the run, read the code from the job summary/log, enter it at google.com/device on any device, approve.
# The workflow then stores the token as the YTMUSIC_OAUTH_JSON secret by itself (needs ADMIN_PAT).
# Nothing on your computer is installed or inspected.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: discovery/requirements.txt
      - run: pip install -r discovery/requirements.txt
      - name: Device sign-in (read the code below, enter it at google.com/device)
        env:
          YTMUSIC_OAUTH_CLIENT_ID: ${{ secrets.YTMUSIC_OAUTH_CLIENT_ID }}
          YTMUSIC_OAUTH_CLIENT_SECRET: ${{ secrets.YTMUSIC_OAUTH_CLIENT_SECRET }}
          ADMIN_PAT: ${{ secrets.ADMIN_PAT }}
        run: python -m discovery.oauth
