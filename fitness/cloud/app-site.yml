# The Training app's own site: chrisrohn.github.io, the GitHub Pages site of the public chrisrohn/chrisrohn.github.io
# repository, kept apart from chrisrohn.com so Android installs it as an app of its own (the music app's scope is all
# of chrisrohn.com). This file lives there as .github/workflows/deploy.yml; this copy is its source.
#
# Each run checks out chrisrohn/chrisrohn (public: no token needed), builds the data-free app with
# `node fitness/build-app.mjs`, and commits the result to this repository's main branch, which Pages serves. Hourly it
# does that only when fitness/ has changed since the last deploy; "Run workflow" deploys any branch or commit at once.
name: Deploy the Training app

on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: chrisrohn/chrisrohn branch, tag or commit to build
        default: main

permissions:
  contents: write   # the built site, committed to main
  pages: write      # ask Pages to rebuild after the push
  actions: write    # keep this schedule from being switched off after 60 quiet days

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          path: site
      - uses: actions/checkout@v7
        with:
          repository: chrisrohn/chrisrohn
          ref: ${{ inputs.ref || 'main' }}
          path: src
          persist-credentials: false
      - name: What to build
        id: src
        run: |
          cd src
          if ! grep -q "export function buildStandalone" fitness/build-app.mjs; then
            echo "This ref predates the app's own site: nothing to deploy." && echo "skip=1" >> "$GITHUB_OUTPUT" && exit 0
          fi
          hash="$(git rev-parse HEAD:fitness)-$(git rev-parse HEAD:package.json)"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(cat ../site/.source 2>/dev/null)" = "$hash" ]; then
            echo "Unchanged since the last deploy." && echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        if: steps.src.outputs.skip != '1'
        with:
          node-version: "22"
      - name: Build
        if: steps.src.outputs.skip != '1'
        run: |
          cd src
          npm install --no-save --ignore-scripts --no-audit --no-fund "maplibre-gl@$(node -p "require('./package.json').devDependencies['maplibre-gl']")"
          node fitness/build-app.mjs ../out
      - name: Publish
        if: steps.src.outputs.skip != '1'
        run: |
          cd site
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name README.md -exec rm -rf {} +
          cp -a ../out/. .
          echo "${{ steps.src.outputs.hash }}" > .source
          git add -A
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Deploy chrisrohn/chrisrohn@$(git -C ../src rev-parse --short HEAD) [${{ inputs.ref || 'main' }}]"
          git push -q
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" >/dev/null 2>&1 || true
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Keep the schedule on
        if: always()
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/enable" >/dev/null 2>&1 || true
        env:
          GH_TOKEN: ${{ github.token }}
