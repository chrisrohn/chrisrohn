# Your private training-data repository's only workflow (.github/workflows/training.yml there). The work itself lives
# in chrisrohn/chrisrohn's .github/workflows/fitness-sync.yml; this file only says when to run it and with which secrets.
#
# Secrets (Settings → Secrets and variables → Actions): STATE_KEY, GARMIN_EMAIL, GARMIN_PASSWORD, STRAVA_CLIENT_ID,
# STRAVA_CLIENT_SECRET. The app at chrisrohn.com/fitness/ starts runs with its token: "Sync now", "Connect Garmin",
# "Connect Strava", and "garmin-code 123456", which only carries the code Garmin emailed to the sign-in waiting for it;
# "push-subscribe" / "push-test" for the morning notification, and "service" when you mark a bike job done.
name: Training sync
run-name: ${{ inputs.action == 'garmin-code' && format('garmin-code {0}', inputs.code) || inputs.action || 'sync' }}

on:
  schedule:
    # hourly while you're up: 5:17 to 22:17 in Michigan (EDT; an hour earlier in winter). A run takes about half a
    # minute, so this is ~570 of a private repository's 2,000 free Actions minutes a month. The app also syncs when
    # you open it and the last sync is over 45 minutes old, so waking up and opening it gets you last night's call.
    - cron: "17 0-2,9-23 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        options: [sync, connect-garmin, connect-strava, garmin-code, push-subscribe, push-test, service]
        default: sync
      code:
        description: The Strava or Garmin code, a notification subscription, or a bike job done (the app fills this in)
        type: string
        default: ""

permissions:
  contents: write
  actions: read

jobs:
  sync:
    if: inputs.action != 'garmin-code'
    uses: chrisrohn/chrisrohn/.github/workflows/fitness-sync.yml@main
    with:
      action: ${{ inputs.action || 'sync' }}
      code: ${{ inputs.code }}
    secrets: inherit
